services:

  db:
    container_name: helptrack-db
    image: postgres:16-alpine
    ports: 
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", $POSTGRES_USER, "-d", $POSTGRES_DB]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file: .env
    networks: 
      - rede_local
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  db_test:
    image: postgres:16-alpine
    ports: 
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", postgres, "-d", db_test]
      interval: 5s
      timeout: 5s
      retries: 10
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_DB: db_test
      POSTGRES_PASSWORD: 123
    profiles: 
      - testing
    
  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:123@db_test:5432/db_test
    depends_on:
      db_test:
        condition: service_healthy
    profiles:
      - testing

  api:
    container_name: helptrack-api
    build:
      context: .
    env_file: .env
    ports: 
      - 5000:5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_local

  adminer:
    container_name: helptrack-adminer
    image: adminer
    ports: 
      - 8080:8080
    networks:
      - rede_local

networks:
  rede_local:
    driver: bridge

volumes:
  postgres_data:

